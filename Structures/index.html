<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Faça login para entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header class="site-header">
    <div>
    <a href="index.html">
     <span class="logo-text"> NETFLIX</span>
    </a>
      </div>
  </header>
 
  <main class="login-main">
    <section class="login-box" aria-labelledby="login-title">
      <h1 id="login-title">Informe seus dados para <br> entrar</h1>
      <p> Ou crie uma conta.</p>
 
      <form class="login-form" id="loginForm" novalidate>
 
        <div class="form-group">
          <label for="email">Email ou número de celular</label>
          <input id="entrar"
            type="text"
            name="email"
            required
            autocomplete="username"
          >
          <span class="error-message" id="emailError" role="alert"></span>
        </div>

            autocomplete="current-password"

          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
            Mostrar
          </button>

          <span class="error-message" id="passwordError" role="alert"></span>
        </div> --->
 
        <button type="submit" class="btn-entrar">Continuar</button>

          <a href="#" class="ajuda-link">Ajuda</a>
        
 
 
        <p class="recaptcha-text">
          Esta página é protegida pelo Google reCAPTCHA para confirmar que você não é um robô.
          <a href="#">Saiba mais.</a>
        </p>
      </form>
    </section>
  </main>
